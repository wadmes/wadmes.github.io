  <rect class="core" x="206" y="67" width="18" height="16" rx="2"/><rect class="core" x="228" y="67" width="18" height="16" rx="2"/>

  <rect class="core" x="74" y="87" width="18" height="16" rx="2"/><rect class="core" x="96" y="87" width="18" height="16" rx="2"/>
  <rect class="core" x="118" y="87" width="18" height="16" rx="2"/><rect class="core" x="140" y="87" width="18" height="16" rx="2"/>
  <rect class="core" x="162" y="87" width="18" height="16" rx="2"/><rect class="core" x="184" y="87" width="18" height="16" rx="2"/>
  <rect class="core" x="206" y="87" width="18" height="16" rx="2"/><rect class="core" x="228" y="87" width="18" height="16" rx="2"/>
</g>

