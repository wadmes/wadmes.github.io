<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL 世界赛概率模拟器</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>英雄联盟世界赛概率模拟器</h1>
        <p>基于战力分和蒙特卡洛模拟</p>
    </header>

    <main class="container">
        <section class="control-panel">
            <h2><span class="icon">⚙️</span> 控制面板</h2>
            
            <div class="control-group">
                <h3>全局模拟参数</h3>
                <div class="slider-group">
                    <label for="eloScale">战力分影响系数 (默认: 400)</label>
                    <input type="range" id="eloScale" min="100" max="1000" value="400">
                    <span id="eloScaleValue">400</span>
                    <small>数值越小，战力分差距对胜率影响越大。</small>
                </div>
                <div class="slider-group">
                    <label for="kFactor">战力分更新系数 (K-Factor, 默认: 32)</label>
                    <input type="range" id="kFactor" min="1" max="100" value="32">
                    <span id="kFactorValue">32</span>
                    <small>数值越大，单场比赛对战力分更新影响越大。</small>
                </div>
                 <div class="slider-group">
                    <label for="simulations">模拟次数</label>
                    <input type="range" id="simulations" min="100" max="10000" value="1000" step="100">
                    <span id="simulationsValue">1000</span>
                    <small>次数越多，结果越稳定，但计算时间越长。</small>
                </div>
            </div>

            <button id="runSimulationBtn" class="cta-button">
                <span class="button-text">运行模拟</span>
                <span class="loading-spinner" style="display: none;"></span>
            </button>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div id="simulationStatus"></div>

            <h2><span class="icon">📈</span> 战力分 (可编辑)</h2>
            <div id="ratingsContainer" class="ratings-grid">
                </div>

        </section>

        <section class="results-panel">
            <h2><span class="icon">🏆</span> 冠军概率排行榜</h2>
            <div id="championProbContainer" class="probability-list">
                <div class="placeholder">点击 "运行模拟" 开始计算</div>
            </div>

            <h2><span class="icon">🇨🇭</span> 瑞士轮出线概率</h2>
            <div id="swissProbContainer" class="probability-list">
                <div class="placeholder">点击 "运行模拟" 开始计算</div>
            </div>

            <h2><span class="icon">⚔️</span> 比赛结果 (开发中)</h2>
            <div id="matchHistoryContainer" class="match-history">
                <div class="placeholder">未来版本将允许手动设置比赛结果。</div>
                </div>
        </section>
    </main>

    <footer>
        <p>本项目仅供娱乐和技术演示</p>
    </footer>

    <script src="data.js"></script>
    <script src="simulator.js"></script>
    <script src="app.js"></script>
</body>
</html>
